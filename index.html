<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flare">
  <meta name="theme-color" content="#02040f">
  <title>Flare</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    /* Flare: 让浏览器不要抢手势（滚动 / 缩放 / 长按菜单 / 选中文字） */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #02040f; overflow: hidden;
      overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    #unity-canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; display: block;
      background: #02040f; touch-action: none; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: .5em; }
    #loading .logo { font-size: 64px; font-weight: 700; margin-bottom: 28px; padding-left: .5em; }
    #loading .bar { width: min(420px, 60vw); height: 6px; background: rgba(255,255,255,.12); border-radius: 3px; overflow: hidden; }
    #fill { width: 0; height: 100%; background: #78ccff; transition: width .2s; }
    #fs { position: fixed; left: 12px; bottom: 12px; width: 40px; height: 40px; opacity: .6; border: 0; border-radius: 10px; z-index: 5;
      background: rgba(255,255,255,.08); color: rgba(255,255,255,.75); font-size: 22px; cursor: pointer; }
    #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 10;
      background: #02040f; color: #fff; font: 600 20px -apple-system, "Segoe UI", sans-serif; letter-spacing: .2em; text-align: center; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><div class="logo">FLARE</div><div class="bar"><div id="fill"></div></div></div>
  <button id="fs" title="Fullscreen">&#x26F6;</button>
  <div id="rotate">ROTATE TO LANDSCAPE</div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    // 阻止 iOS Safari 的双指缩放、双击放大、页面拖动、长按菜单
    ["gesturestart", "gesturechange", "gestureend", "dblclick", "contextmenu"].forEach(function (e) {
      document.addEventListener(e, function (ev) { ev.preventDefault(); }, { passive: false });
    });
    document.addEventListener("touchmove", function (ev) { ev.preventDefault(); }, { passive: false });

    function goFullscreen() {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) { try { req.call(el); } catch (e) {} }
    }
    document.querySelector("#fs").addEventListener("click", goFullscreen);
    document.addEventListener("fullscreenchange", function () { document.querySelector("#fs").style.display = document.fullscreenElement ? "none" : "block"; });

    var buildUrl = "Build";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/6fcd85f1bed9990e74dad77fe6c0e157.data.unityweb",
      frameworkUrl: buildUrl + "/2124a69b9035080cc537eeb25251bd4d.framework.js.unityweb",
      codeUrl: buildUrl + "/ff2d2453410a96d6d9085885cbc7fd24.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "My project (5)",
      productVersion: "1.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, (Math.max(screen.width, screen.height) > 1100 ? 1.5 : 2)),   // 大屏（iPad）降一点分辨率，省显存
    };
    var script = document.createElement("script");
    script.src = buildUrl + "/f3d17dc11bde43d2d78401c7b52d0319.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        document.querySelector("#fill").style.width = (100 * p) + "%";
      }).then(function (instance) {
        window.unityInstance = instance;
        document.querySelector("#loading").remove();
        canvas.focus();
      }).catch(function (message) { alert(message); });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
